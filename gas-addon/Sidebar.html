<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Valeurs reprises telles quelles de themes.css (bloc Classica, themes.css:127-226) et de
       sidepanel.css — cette sidebar ne charge pas ces fichiers, donc dupliquees ici. Reprend
       aussi les classes/l'ordre des sections de sidepanel.html/.css (retour utilisateur direct :
       la sidebar de l'add-on doit ressembler a celle de l'extension autant que possible). */
    :root {
      --t-primary: #2d6a5a;
      --t-accent: #d4944c;
      --t-bg: #faf6f0;
      --t-bg-card: #ffffff;
      --t-bg-element: #f0ebe3;
      --t-text: #3d3832;
      --t-text-secondary: #5a534b;
      --t-text-muted: #6b6259;
      --t-text-dim: #766c61;
      --t-text-on-primary: #ffffff;
      --t-text-on-accent: #2e1c0a;
      --t-border: #d5cec4;
      --t-border-strong: #b5ad9f;
      --t-danger: #b44040;
      --t-success: #2d8a4e;

      --t-font-title: 'Playfair Display', Georgia, serif;
      --t-font-body: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --t-title-spacing: 1px;

      --t-glass-bg: rgba(45, 106, 90, 0.04);
      --t-glass-bg-hover: rgba(45, 106, 90, 0.08);

      --t-primary-a05: rgba(45, 106, 90, 0.05);
      --t-primary-a08: rgba(45, 106, 90, 0.08);
      --t-primary-a10: rgba(45, 106, 90, 0.10);
      --t-primary-a15: rgba(45, 106, 90, 0.15);
      --t-primary-a20: rgba(45, 106, 90, 0.20);
      --t-primary-a30: rgba(45, 106, 90, 0.30);
      --t-primary-a40: rgba(45, 106, 90, 0.40);
      --t-primary-a50: rgba(45, 106, 90, 0.50);
      --t-accent-a10: rgba(212, 148, 76, 0.10);
      --t-accent-a15: rgba(212, 148, 76, 0.15);
      --t-accent-a20: rgba(212, 148, 76, 0.20);
      --t-accent-a40: rgba(212, 148, 76, 0.40);

      /* Ombre douce uniforme — charte Classica : jamais de glow colore/neon,
         voir skill design-classica ("Ombres douces... jamais de glow neon"). */
      --t-shadow-soft: 0 2px 8px rgba(0, 0, 0, 0.08);

      --t-gradient-panel: linear-gradient(180deg, rgba(45, 106, 90, 0.02), rgba(212, 148, 76, 0.02));
      --t-gradient-btn: linear-gradient(90deg, #2d6a5a, #357a68);
      --t-gradient-btn-accent: linear-gradient(90deg, #d4944c, #c4862e);

      --t-radius-sm: 4px;
      --t-radius: 4px;
      --t-radius-lg: 8px;

      --t-select-bg: #f0ebe3;
      --t-scrollbar-track: rgba(0, 0, 0, 0.02);

      --t-btn-primary-bg: var(--t-gradient-btn);
      --t-btn-primary-text: #ffffff;
      --t-btn-secondary-bg: var(--t-gradient-btn-accent);
      --t-btn-secondary-text: #ffffff;

      --t-translation-bg: #2d6a5a;
      --t-translation-text: #ffffff;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--t-bg);
      color: var(--t-text-secondary);
      font-family: var(--t-font-body);
      box-sizing: border-box;
    }

    /* En-tete — pas de titre "Daspalecte" ici : la sidebar Apps Script affiche deja le sien
       dans sa propre barre native, un second titre juste en dessous faisait doublon (retour
       utilisateur). La place est donc rendue au reglage de langue maternelle, qui vit dans le
       popup de l'extension — popup absent d'un add-on Docs/Sheets/Slides. */
    header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--t-border);
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--t-accent);
      opacity: 0.9;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* Repli quand la sidebar est trop etroite pour le libelle : seule l'icone reste
       (le <select> garde alors toute la largeur utile). */
    @media (max-width: 270px) {
      .lang-label .lang-label-text {
        display: none;
      }
    }

    .lang-select {
      flex: 1;
      min-width: 0;
      background: var(--t-select-bg);
      border: 1px solid var(--t-border);
      color: var(--t-text);
      padding: 8px;
      border-radius: var(--t-radius-sm);
      font-size: 0.85rem;
      font-family: var(--t-font-body);
      outline: none;
      box-sizing: border-box;
    }

    /* Cartes de section — equivalent de sidepanel.css:72-98 (.tool-section/.section-header) */
    .tool-section {
      background: var(--t-glass-bg);
      border: 1px solid var(--t-border);
      border-radius: var(--t-radius-lg);
      margin-bottom: 16px;
      padding: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      /* Bloc de reference des bulles d'info : ancrees a la LARGEUR DE LA CARTE et non a
         l'icone, sinon une bulle de largeur fixe deborde de la sidebar (etroite) des que
         l'icone se trouve un peu a droite. Le z-index maintient l'en-tete (donc la bulle)
         au-dessus du bouton d'action de la section, qui le suit dans le flux. */
      position: relative;
      z-index: 2;
    }

    .section-header-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .section-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .tool-section h2 {
      font-family: var(--t-font-title);
      font-size: 0.9rem;
      margin: 0;
      color: var(--t-primary);
      opacity: 0.9;
    }

    .section-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Interrupteurs — equivalent de sidepanel.css:129-176 (.switch/.slider), sans le glow
       (charte Classica). Dans l'extension ils activent l'ecoute des clics sur la page ; ici
       le modele est "selectionner puis cliquer", donc ils activent/desactivent le bouton
       d'action de la section (et son etat est persiste comme dans l'extension). */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--t-border-strong);
      transition: .4s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: .4s;
      border-radius: 50%;
    }

    .switch input:checked + .slider {
      background-color: var(--t-primary);
    }

    .switch input:checked + .slider:before {
      transform: translateX(20px);
    }

    .switch input:focus-visible + .slider {
      outline: 2px solid var(--t-accent);
      outline-offset: 2px;
    }

    /* Bulle d'info au survol — remplace le paragraphe de consigne, qui prenait une place
       importante dans une sidebar deja etroite. Egalement declenchee au focus clavier. */
    .info-tip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border: 1px solid var(--t-primary-a40);
      border-radius: 50%;
      background: none;
      color: var(--t-text-muted);
      font-family: var(--t-font-title);
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1;
      cursor: help;
      padding: 0;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    /* Pas d'`opacity` sur .info-tip pour l'attenuer : elle creerait un contexte
       d'empilement, et la bulle absolue resterait alors coincee SOUS le bouton
       d'action de la section (constate en test). Attenuation par la couleur. */
    .info-tip:hover,
    .info-tip:focus-visible {
      border-color: var(--t-primary);
      color: var(--t-primary);
    }

    .info-tip .info-bubble {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--t-bg-card);
      border: 1px solid var(--t-border);
      border-radius: var(--t-radius-sm);
      box-shadow: var(--t-shadow-soft);
      color: var(--t-text-secondary);
      font-family: var(--t-font-body);
      font-size: 0.72rem;
      font-weight: 400;
      line-height: 1.45;
      text-align: left;
      padding: 8px 10px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, visibility 0.15s ease;
      z-index: 10;
    }

    .info-tip:hover .info-bubble,
    .info-tip:focus-visible .info-bubble {
      opacity: 1;
      visibility: visible;
    }

    /* Boutons d'action — equivalent de sidepanel.css:384-401 (.action-btn) */
    .action-btn {
      background: var(--t-btn-primary-bg);
      border: none;
      color: var(--t-btn-primary-text);
      padding: 10px;
      border-radius: var(--t-radius-sm);
      font-family: var(--t-font-title);
      font-weight: bold;
      font-size: 0.75rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      filter: brightness(1.06);
      box-shadow: var(--t-shadow-soft);
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: none;
      box-shadow: none;
    }

    .action-btn.secondary {
      background: var(--t-btn-secondary-bg);
    }

    .result-box {
      background: var(--t-bg-card);
      border: 1px solid var(--t-border);
      border-radius: var(--t-radius-sm);
      padding: 10px 12px;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .result-word {
      font-weight: 700;
      color: var(--t-primary);
    }

    .comprehension-label {
      font-weight: 700;
      color: var(--t-accent);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 3px;
    }

    /* Liste de vocabulaire — equivalent de sidepanel.css:193-296 (.word-list-container/.word-item).
       Elle vit DANS la carte "Vocabulaire", sous le bouton de traduction (et non dans une carte
       "Mots" separee comme au depart) : c'est la meme carte qui produit les mots et qui les
       affiche. Sous-en-tete pour la separer visuellement du bloc de traduction. */
    .subsection {
      border-top: 1px solid var(--t-border);
      padding-top: 12px;
      margin-top: 2px;
    }

    .subsection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .subsection-header h3 {
      font-family: var(--t-font-title);
      font-size: 0.82rem;
      margin: 0;
      color: var(--t-primary);
      opacity: 0.9;
    }

    /* Lien "Tout cocher" — equivalent de sidepanel.css:367-382 (.text-link) */
    .text-link {
      background: none;
      border: none;
      color: var(--t-primary);
      font-size: 0.72rem;
      font-family: var(--t-font-body);
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
      padding: 0;
    }

    .text-link:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* Corbeille de suppression groupee — equivalent de sidepanel.css (.header-icon-btn),
       masquee tant qu'aucun mot n'est coche. */
    .header-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 2px 4px;
      border-radius: var(--t-radius-sm);
      transition: all 0.2s ease;
      opacity: 0.8;
    }

    .header-icon-btn:hover {
      background: var(--t-accent-a15);
      opacity: 1;
    }

    .header-icon-btn.hidden {
      display: none;
    }

    .word-list-container {
      min-height: 60px;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--t-glass-bg);
      background: var(--t-scrollbar-track);
      border-radius: var(--t-radius-sm);
      padding: 8px;
    }

    .empty-msg {
      font-size: 0.78rem;
      opacity: 0.5;
      text-align: center;
      margin: 14px 0;
      font-style: italic;
    }

    .word-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--t-glass-bg);
      border: 1px solid var(--t-accent-a20);
      padding: 7px 10px;
      border-radius: var(--t-radius-sm);
      margin-bottom: 6px;
      font-size: 0.8rem;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .word-item:last-child {
      margin-bottom: 0;
    }

    .word-item:hover {
      background: var(--t-glass-bg-hover);
      border-color: var(--t-accent-a40);
    }

    /* Case a cocher — equivalent de sidepanel.css:226-260 (.word-checkbox), sans le glow.
       Ce sont les mots COCHES qui alimentent la generation d'exercices (comme dans
       l'extension), pas la liste entiere. */
    .word-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--t-text-dim);
      border-radius: var(--t-radius-sm);
      cursor: pointer;
      position: relative;
      background: var(--t-bg-card);
      flex-shrink: 0;
      transition: all 0.2s ease;
      margin: 0;
    }

    .word-checkbox:hover {
      border-color: var(--t-primary);
    }

    .word-checkbox:checked {
      border-color: var(--t-primary);
      background: var(--t-primary-a15);
    }

    .word-checkbox:checked::after {
      content: "\2713";
      position: absolute;
      color: var(--t-primary);
      font-size: 11px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .word-content {
      flex: 1;
      min-width: 0;
    }

    .word-translation {
      opacity: 0.65;
      font-style: italic;
    }

    .word-remove-btn {
      background: none;
      border: none;
      color: var(--t-danger);
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      flex-shrink: 0;
    }

    /* Barre d'actions sous la liste — equivalent de sidepanel.css:298-316 (.actions-bar),
       masquee tant qu'il n'y a aucun mot (comme le bouton "Generer des exercices" de
       l'extension, qui n'apparait que si des mots ont ete selectionnes). */
    .actions-bar {
      display: none;
      margin-top: 14px;
    }

    .actions-bar .action-btn {
      width: 100%;
    }

    /* Pied de page — equivalent de sidepanel.css:428-458 (.branding-footer + .branding-logo).
       Le logo est inline en data: URI : un add-on Apps Script n'expose aucun fichier statique,
       il n'y a donc pas d'URL a mettre dans src (l'extension, elle, sert logo-pedagokit.png
       depuis son propre paquet). Le fichier source est logo-pedagokit.png a la racine du repo,
       redimensionne a 200px de large avant encodage. */
    .branding-footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--t-border);
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .branding-footer p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--t-primary);
      opacity: 0.75;
      font-family: var(--t-font-title);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .branding-logo {
      height: 45px;
      width: auto;
      filter: drop-shadow(0 2px 6px rgba(61, 56, 50, 0.18));
    }
  </style>
</head>
<body>
  <header>
    <label class="lang-label" for="lang-select">
      <span aria-hidden="true">🌐</span>
      <span class="lang-label-text">Ma langue</span>
    </label>
    <select id="lang-select" class="lang-select">
      <option value="ar">Arabe</option>
      <option value="en">Anglais</option>
      <option value="fa">Dari</option>
      <option value="es">Espagnol</option>
      <option value="ku">Kurde</option>
      <option value="ps">Pashto</option>
      <option value="pl">Polonais</option>
      <option value="ro">Roumain</option>
      <option value="ru">Russe</option>
      <option value="tr">Turc</option>
      <option value="uk">Ukrainien</option>
    </select>
  </header>

  <!-- Vocabulaire : la traduction de la selection ET la liste des mots obtenus vivent dans la
       meme carte, comme dans le sidepanel de l'extension ou ces deux blocs se suivent. -->
  <section class="tool-section">
    <div class="section-header">
      <div class="section-header-title">
        <h2>Vocabulaire</h2>
        <span class="info-tip" tabindex="0" role="note"
              aria-label="Sélectionne un mot ou une courte expression dans le document, puis clique">
          i
          <span class="info-bubble">Sélectionne un mot ou une courte expression dans le document, puis clique</span>
        </span>
      </div>
      <label class="switch">
        <input type="checkbox" id="translator-toggle" aria-label="Activer le traducteur">
        <span class="slider"></span>
      </label>
    </div>
    <div class="section-content">
      <button id="translate-btn" class="action-btn" type="button" disabled>Traduire la sélection</button>
      <div id="translate-result" class="result-box" style="display:none;"></div>

      <div class="subsection">
        <div class="subsection-header">
          <h3>Mots (<span id="vocab-count">0</span>)</h3>
          <div class="section-header-actions">
            <button id="delete-selected" class="header-icon-btn hidden" type="button"
                    title="Supprimer la sélection" aria-label="Supprimer les mots cochés">🗑️</button>
            <button id="select-all" class="text-link" type="button">Tout cocher</button>
          </div>
        </div>
        <div id="word-list" class="word-list-container">
          <p class="empty-msg">Aucun mot pour le moment.</p>
        </div>
        <div class="actions-bar" id="words-actions">
          <button id="generate-ex-btn" class="action-btn secondary" type="button">Générer des exercices</button>
        </div>
      </div>
    </div>
  </section>

  <section class="tool-section">
    <div class="section-header">
      <div class="section-header-title">
        <h2>Compréhension</h2>
        <span class="info-tip" tabindex="0" role="note"
              aria-label="Sélectionne un paragraphe, puis clique pour un résumé et une reformulation simplifiée">
          i
          <span class="info-bubble">Sélectionne un paragraphe, puis clique pour un résumé et une reformulation simplifiée.</span>
        </span>
      </div>
      <label class="switch">
        <input type="checkbox" id="comprehension-toggle" aria-label="Activer l'aide à la compréhension">
        <span class="slider"></span>
      </label>
    </div>
    <div class="section-content">
      <button id="comprehension-btn" class="action-btn" type="button" disabled>Expliquer la sélection</button>
      <div id="comprehension-result" class="result-box" style="display:none;"></div>
    </div>
  </section>

  <!-- Masquee dans Sheets (un tableau n'est pas un texte suivi) : voir le script en bas
       de page, la section n'est revelee qu'une fois l'hote connu. -->
  <section class="tool-section" id="reading-test-section" style="display:none;">
    <div class="section-header">
      <h2>Test de lecture</h2>
    </div>
    <div class="section-content">
      <button id="reading-test-btn" class="action-btn" type="button">Passer le test</button>
      <div id="reading-test-result" class="result-box" style="display:none;"></div>
    </div>
  </section>

  <script>
    const langSelect = document.getElementById('lang-select');
    const translateBtn = document.getElementById('translate-btn');
    const resultBox = document.getElementById('translate-result');
    const vocabListEl = document.getElementById('word-list');
    const vocabCountEl = document.getElementById('vocab-count');
    const wordsActionsEl = document.getElementById('words-actions');
    const selectAllBtn = document.getElementById('select-all');
    const deleteSelectedBtn = document.getElementById('delete-selected');
    const translatorToggle = document.getElementById('translator-toggle');
    const comprehensionToggle = document.getElementById('comprehension-toggle');

    // Langue maternelle : chargée au démarrage, sauvegardée à chaque changement.
    google.script.run.withSuccessHandler((lang) => { langSelect.value = lang; }).getNativeLanguage();
    langSelect.onchange = () => {
      google.script.run.setNativeLanguage(langSelect.value);
    };

    /*
      Interrupteurs des sections. L'extension les utilise pour brancher/debrancher l'ecoute
      des clics dans la page ; ici, ou l'eleve selectionne puis clique un bouton, ils
      activent/desactivent ce bouton. Etat persiste cote serveur (UserProperties), comme
      chrome.storage.local.translatorEnabled dans l'extension — et desactive par defaut,
      comme elle.
    */
    function applyToggleState(toggle, button) {
      button.disabled = !toggle.checked;
      button.title = toggle.checked ? '' : 'Active cet outil avec l\'interrupteur ci-dessus.';
    }

    translatorToggle.onchange = () => {
      applyToggleState(translatorToggle, translateBtn);
      google.script.run.setToolEnabled('translator', translatorToggle.checked);
    };

    comprehensionToggle.onchange = () => {
      applyToggleState(comprehensionToggle, comprehensionBtn);
      google.script.run.setToolEnabled('comprehension', comprehensionToggle.checked);
    };

    google.script.run
      .withSuccessHandler((states) => {
        translatorToggle.checked = !!(states && states.translator);
        comprehensionToggle.checked = !!(states && states.comprehension);
        applyToggleState(translatorToggle, translateBtn);
        applyToggleState(comprehensionToggle, comprehensionBtn);
      })
      .getToolStates();

    /*
      Selection des mots : ce sont les mots COCHES qui alimentent la generation d'exercices,
      exactement comme dans le sidepanel de l'extension (sidepanel.js:gen-exercises).
    */
    function selectedWordItems() {
      return Array.from(vocabListEl.querySelectorAll('.word-item'))
        .filter((item) => item.querySelector('.word-checkbox').checked);
    }

    function updateActionsBarVisibility() {
      const total = vocabListEl.querySelectorAll('.word-item').length;
      const checked = selectedWordItems().length;

      wordsActionsEl.style.display = total ? 'block' : 'none';
      deleteSelectedBtn.classList.toggle('hidden', checked === 0);
      selectAllBtn.style.display = total ? 'inline' : 'none';
      selectAllBtn.textContent = (total && checked === total) ? 'Tout décocher' : 'Tout cocher';
    }

    function renderVocabulary(list) {
      vocabCountEl.textContent = list.length;
      vocabListEl.innerHTML = '';
      if (!list.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-msg';
        empty.textContent = 'Aucun mot pour le moment.';
        vocabListEl.appendChild(empty);
        updateActionsBarVisibility();
        return;
      }
      list.forEach((item) => {
        const li = document.createElement('div');
        li.className = 'word-item';
        li.dataset.word = item.word;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'word-checkbox';
        checkbox.setAttribute('aria-label', 'Sélectionner ' + item.word);
        checkbox.onchange = updateActionsBarVisibility;

        const span = document.createElement('span');
        span.className = 'word-content';
        span.innerHTML = item.word + ' <span class="word-translation">→ ' + item.translation + '</span>';

        const removeBtn = document.createElement('button');
        removeBtn.className = 'word-remove-btn';
        removeBtn.type = 'button';
        removeBtn.textContent = '✕';
        removeBtn.setAttribute('aria-label', 'Retirer ' + item.word);
        removeBtn.onclick = () => {
          google.script.run.withSuccessHandler(renderVocabulary).removeVocabularyWord(item.word);
        };

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(removeBtn);
        vocabListEl.appendChild(li);
      });
      updateActionsBarVisibility();
    }

    google.script.run.withSuccessHandler(renderVocabulary).getVocabulary();

    selectAllBtn.onclick = () => {
      const boxes = Array.from(vocabListEl.querySelectorAll('.word-checkbox'));
      const allChecked = boxes.length > 0 && boxes.every((cb) => cb.checked);
      boxes.forEach((cb) => { cb.checked = !allChecked; });
      updateActionsBarVisibility();
    };

    deleteSelectedBtn.onclick = () => {
      const words = selectedWordItems().map((item) => item.dataset.word);
      if (!words.length) return;
      google.script.run.withSuccessHandler(renderVocabulary).removeVocabularyWords(words);
    };

    translateBtn.onclick = () => {
      resultBox.style.display = 'block';
      resultBox.textContent = 'Lecture de la sélection...';
      translateBtn.disabled = true;

      google.script.run
        .withSuccessHandler((selectedText) => {
          if (!selectedText) {
            resultBox.textContent = 'Aucune sélection détectée dans le document.';
            translateBtn.disabled = false;
            return;
          }
          // Traduction limitée à un mot ou une courte expression : pas de passage entier
          // (l'aide à la compréhension, sur des paragraphes, sera une fonction séparée).
          const wordCount = selectedText.trim().split(/\s+/).filter(Boolean).length;
          if (wordCount > 3) {
            resultBox.textContent = 'Sélectionne au maximum 3 mots pour la traduction (' + wordCount + ' sélectionnés).';
            translateBtn.disabled = false;
            return;
          }
          resultBox.textContent = 'Traduction en cours...';

          google.script.run
            .withSuccessHandler((translation) => {
              resultBox.innerHTML = '<span class="result-word">' + selectedText + '</span> → ' + translation;

              // Ajout automatique au vocabulaire dès la traduction reçue (comme l'extension
              // Chrome — pas de bouton "Ajouter" séparé).
              google.script.run.withSuccessHandler(renderVocabulary).addVocabularyWord(selectedText, translation);
              translateBtn.disabled = false;
            })
            .withFailureHandler((err) => {
              resultBox.textContent = 'Erreur de traduction : ' + err.message;
              translateBtn.disabled = false;
            })
            .translateText(selectedText, 'auto', langSelect.value);
        })
        .withFailureHandler((err) => {
          resultBox.textContent = 'Erreur de lecture de la sélection : ' + err.message;
          translateBtn.disabled = false;
        })
        .getSelectionText();
    };

    const comprehensionBtn = document.getElementById('comprehension-btn');
    const comprehensionResult = document.getElementById('comprehension-result');

    comprehensionBtn.onclick = () => {
      comprehensionResult.style.display = 'block';
      comprehensionResult.textContent = 'Lecture de la sélection...';
      comprehensionBtn.disabled = true;

      google.script.run
        .withSuccessHandler((selectedText) => {
          if (!selectedText) {
            comprehensionResult.textContent = 'Aucune sélection détectée dans le document.';
            comprehensionBtn.disabled = false;
            return;
          }
          if (selectedText.trim().length < 20) {
            comprehensionResult.textContent = 'Sélectionne un passage plus long (au moins une phrase) — pour un mot seul, utilise "Traduire" ci-dessus.';
            comprehensionBtn.disabled = false;
            return;
          }
          comprehensionResult.textContent = 'Claude prépare le résumé...';

          google.script.run
            .withSuccessHandler((result) => {
              if (!result || !result.summary) {
                comprehensionResult.textContent = 'Erreur : ' + (result && result.message ? result.message : 'réponse inattendue du serveur.');
                comprehensionBtn.disabled = false;
                return;
              }
              comprehensionResult.innerHTML =
                '<div class="comprehension-label">Résumé</div>' +
                '<div>' + result.summary + '</div>' +
                '<div class="comprehension-label" style="margin-top:10px;">Reformulation simplifiée</div>' +
                '<div>' + result.reformulation + '</div>';
              comprehensionBtn.disabled = false;
            })
            .withFailureHandler((err) => {
              comprehensionResult.textContent = 'Erreur : ' + err.message;
              comprehensionBtn.disabled = false;
            })
            .callCloudFunction({ action: 'summarize', text: selectedText, nativeLanguage: langSelect.value });
        })
        .withFailureHandler((err) => {
          comprehensionResult.textContent = 'Erreur de lecture de la sélection : ' + err.message;
          comprehensionBtn.disabled = false;
        })
        .getSelectionText();
    };

    const generateExBtn = document.getElementById('generate-ex-btn');
    generateExBtn.onclick = () => {
      const words = selectedWordItems().map((item) => item.dataset.word);
      if (!words.length) {
        alert('Coche au moins un mot pour générer des exercices.');
        return;
      }
      /*
        Les exercices s'affichent dans un dialogue Apps Script separe (plus grand que la
        sidebar, fermable independamment) plutot qu'inline ici — voir Code.gs et
        ExercisesDialog.html. Les mots coches lui sont transmis via CacheService (meme
        mecanisme que le texte du test de lecture) : un dialogue modal ne peut pas lire
        le DOM de la sidebar.
      */
      generateExBtn.disabled = true;
      google.script.run
        .withSuccessHandler(() => { generateExBtn.disabled = false; })
        .withFailureHandler(() => { generateExBtn.disabled = false; })
        .startExercises(words);
    };

    const readingTestBtn = document.getElementById('reading-test-btn');
    const readingTestSection = document.getElementById('reading-test-section');

    // Le perimetre du test depend de l'application hote (voir Code.gs:getReadingTestText) :
    // dans Docs l'eleve selectionne son passage, dans Slides c'est toute la presentation,
    // dans Sheets le test n'existe pas — la section reste alors masquee.
    google.script.run
      .withSuccessHandler((host) => {
        if (host === 'sheets' || !host) return;
        readingTestSection.style.display = 'block';
      })
      .getActiveHost();

    const readingTestResult = document.getElementById('reading-test-result');

    // Messages de refus affiches ICI et non dans le dialogue : startReadingTest() lit et
    // valide le texte avant d'ouvrir quoi que ce soit, donc en cas de refus aucune fenetre
    // ne s'ouvre — l'eleve reste dans la sidebar, corrige sa selection et reclique.
    function readingTestRefusMessage(reason, host) {
      if (reason === 'no_selection') {
        return 'Sélectionne d\'abord, dans le document, le texte sur lequel tu veux être interrogé.';
      }
      if (reason === 'too_short') {
        return host === 'slides'
          ? 'Le texte de cette présentation est trop court pour générer un test.'
          : 'Le passage sélectionné est trop court — sélectionne un texte plus long.';
      }
      return 'Le test de lecture n\'est pas disponible ici.';
    }

    readingTestBtn.onclick = () => {
      // Meme choix que les exercices : un dialogue modal plutot que la sidebar (10 QCM +
      // appariement en deux colonnes n'y tiennent pas). Voir Code.gs:startReadingTest().
      readingTestBtn.disabled = true;
      readingTestResult.style.display = 'none';
      google.script.run
        .withSuccessHandler((result) => {
          readingTestBtn.disabled = false;
          if (result && result.ok) return;
          readingTestResult.style.display = 'block';
          readingTestResult.textContent = readingTestRefusMessage(
            (result && result.reason) || 'unsupported_host',
            result && result.host
          );
        })
        .withFailureHandler((err) => {
          readingTestBtn.disabled = false;
          readingTestResult.style.display = 'block';
          readingTestResult.textContent = 'Erreur : ' + err.message;
        })
        .startReadingTest();
    };
  </script>
</body>
</html>
