<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Outils de lecture - Daspalecte</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div class="panel-container">
        <!-- Bouton X de fermeture -->
        <button id="close-panel-btn" class="close-panel-btn" title="Fermer le panneau" aria-label="Fermer le panneau">×</button>
        
        <header>
            <h1 class="neon-text">Outils de lecture</h1>
        </header>

        <section class="tool-section">
            <div class="section-header">
                <h2>Traducteur</h2>
                <label class="switch">
                    <input type="checkbox" id="translator-toggle" aria-label="Activer le traducteur">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="section-content translator-tools">
                <button id="capture-btn" class="action-btn capture-btn">📷 Capture & Lecture</button>
            </div>
        </section>

        <section class="tool-section">
            <div class="section-header">
                <h2>Mots</h2>
                <div class="section-header-actions">
                    <button id="delete-selected" class="header-icon-btn hidden" title="Supprimer la sélection" aria-label="Supprimer la sélection">🗑️</button>
                    <button id="select-all" class="text-link">Tout cocher</button>
                </div>
            </div>
            <div class="section-content">
                <div id="word-list" class="word-list-container">
                    <p class="empty-msg">Aucun mot sélectionné</p>
                </div>
                <div class="actions-bar" id="words-actions" style="display: none;">
                    <button id="gen-exercises" class="action-btn">Générer des exercices</button>
                </div>
            </div>
        </section>

        <section class="tool-section">
            <div class="section-header">
                <h2>Compréhension</h2>
                <label class="switch">
                    <input type="checkbox" id="comprehension-toggle" aria-label="Activer l'aide à la compréhension">
                    <span class="slider round"></span>
                </label>
            </div>
        </section>

        <section class="tool-section">
            <div class="section-header">
                <h2>Test de lecture</h2>
                <label class="switch">
                    <input type="checkbox" id="reading-test-toggle" aria-label="Activer le test de lecture">
                    <span class="slider round"></span>
                </label>
            </div>
            <div id="ct-restore-container" style="display: none; margin-top: 10px;">
                <button id="ct-restore-btn" class="action-btn">📝 Afficher le test</button>
            </div>
        </section>

        <footer class="branding-footer">
            <p>2026 - version 2.0.1</p>
            <img src="logo-pedagokit.png"
                alt="Logo PedagokIT" class="branding-logo">
        </footer>
    </div>
    <script src="theme-manager.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
